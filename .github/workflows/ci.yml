name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo. The gitleaks job declares its
# own block because it also needs pull-requests: read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, but let every push to main finish (and upload).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Lint Swift sources
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint \
            "$(awk '/^FROM/ { print $2 }' .github/linters/swiftlint.Dockerfile)" \
            --strict --reporter github-actions-logging

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "$(awk '/^FROM/ { print $2 }' .github/linters/actionlint.Dockerfile)" \
            -color

  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Without Advanced Security the action fails the job on findings,
      # matching the other lint jobs, instead of uploading SARIF.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Test and screenshot
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The runner's default Xcode changes with image updates; build with the
      # version pinned in .xcode-version instead.
      - name: Select pinned Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"

      # Runner images vary in which simulators they ship, so pick whatever
      # iPhone is available (newest runtime) instead of hardcoding a name.
      - name: Select an iPhone simulator
        run: |
          cat > /tmp/pick_sim.py <<'EOF'
          import json
          import subprocess

          out = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout
          data = json.loads(out)["devices"]
          phones = [
              (runtime, device)
              for runtime, devices in sorted(data.items())
              for device in devices
              if device.get("isAvailable") and "iPhone" in device["name"]
          ]
          print(phones[-1][1]["udid"] if phones else "")
          EOF
          UDID=$(python3 /tmp/pick_sim.py)
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator on this runner; downloading the iOS platform..."
            xcodebuild -downloadPlatform iOS
            UDID=$(python3 /tmp/pick_sim.py)
          fi
          if [ -z "$UDID" ]; then
            echo "Still no iPhone simulator available. simctl inventory:"
            xcrun simctl list
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          xcodebuild test \
            -project JustASimpleDice.xcodeproj \
            -scheme JustASimpleDice \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Report code coverage
        run: |
          {
            echo '### Code coverage'
            echo '```'
            xcrun xccov view --report --only-targets TestResults.xcresult
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The result bundle has per-test logs, failure screenshots, and the
      # accessibility audit's findings.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults.xcresult

      - name: Capture simulator screenshot
        run: |
          BUNDLE_ID=$(xcodebuild -showBuildSettings \
            -project JustASimpleDice.xcodeproj \
            -scheme JustASimpleDice \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" 2>/dev/null \
            | awk '/PRODUCT_BUNDLE_IDENTIFIER/ { print $3; exit }')
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" \
            build/Build/Products/Debug-iphonesimulator/JustASimpleDice.app
          xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$SIMULATOR_UDID" screenshot screenshot.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-screenshot
          path: screenshot.png

  # Every push to main that passes CI goes to internal TestFlight testers.
  testflight:
    name: Upload to TestFlight
    needs: [swiftlint, actionlint, zizmor, gitleaks, build]
    # TESTFLIGHT_ENABLED is a repository variable, set once the App Store
    # Connect secrets exist (see CONTRIBUTING.md).
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.TESTFLIGHT_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    # Build numbers come from App Store Connect's latest + 1, so uploads
    # must not overlap.
    concurrency:
      group: app-store-connect-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"

      # Xcode 26 ships the Metal compiler (for FeltTexture.metal) as a
      # separate component that isn't always available on the runner.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # No bundler-cache: caches restored into a job that publishes builds
      # are a cache-poisoning risk.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0

      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          bundle install --jobs 4
          bundle exec fastlane beta
