name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-xcode

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual

      # Swift analysis traces a real build; build for the generic simulator
      # so no specific device needs to exist on the runner. The Metal shader
      # is left out: CodeQL doesn't analyze it, and under the tracer Xcode
      # 26's separately installed Metal compiler can't be found. Swift
      # looks the shader up at runtime, so the build is otherwise unchanged.
      - name: Build
        run: |
          xcodebuild build \
            -project JustASimpleDice.xcodeproj \
            -scheme JustASimpleDice \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES=FeltTexture.metal

      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: "/language:swift"
