version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, so compromised or broken
    # versions are more likely to be yanked before we adopt them.
    cooldown:
      default-days: 7
    # One PR a week instead of one per action. This also keeps paired
    # actions (codeql-action/init and /analyze) on the same version.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # CI's SwiftLint image, pinned in .github/linters/swiftlint.Dockerfile.
  - package-ecosystem: "docker"
    directory: "/.github/linters"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      linters:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # fastlane (CI-only release tooling).
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      ruby:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
